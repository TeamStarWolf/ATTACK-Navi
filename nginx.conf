# nginx site config for the ATTACK-Navi app image.
#
# The root Dockerfile installs this file as /etc/nginx/templates/default.conf.template
# and nginx-security-headers.conf as /etc/nginx/templates/security-headers.inc.template.
# The nginx image's entrypoint runs envsubst over both at container start, so the
# ${PROXY_UPSTREAM}, ${NGINX_RESOLVER} and ${CSP_EXTRA_CONNECT_SRC} placeholders are
# filled from the container environment (defaults in the Dockerfile, overrides in
# docker-compose.yml). To use this file with a bare nginx, replace the placeholders
# by hand and put the snippet where the include below points.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (CSP, nosniff, frame options, referrer policy) live in one
    # snippet. nginx inherits add_header only into blocks that declare NO add_header
    # of their own, so every location below that adds a header of its own includes
    # the snippet again; otherwise those responses would ship with none of them.
    include /etc/nginx/conf.d/security-headers.inc;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin route to the optional credentials proxy (server/): the browser
    # talks to /api/ on this origin, so the proxy needs no entry in connect-src and
    # the page origin is what the proxy's ALLOWED_ORIGINS must list. The upstream is
    # resolved per request through the resolver, so nginx still starts when no proxy
    # container exists (app-only deployments answer 502 here).
    location ^~ /api/ {
        include /etc/nginx/conf.d/security-headers.inc;
        resolver ${NGINX_RESOLVER} valid=30s;
        set $proxy_upstream ${PROXY_UPSTREAM};
        proxy_pass $proxy_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
