name: E2E Tests

# End-to-end tests run on their own, NON-BLOCKING, so a slow or flaky browser
# run on a constrained runner never blocks the Pages deploy. The deploy
# workflow gates on unit tests + build only.
#
# The path lists below must stay identical for push and pull_request. They
# cover everything the suite's behaviour depends on: the app and tests, the
# build configuration (angular.json, tsconfig*), the lockfile, the assets
# under public/ that the matrix renders, and this workflow itself. Leaving
# this file out of its own filter is how the Node-24 fix once landed without
# ever running the suite.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'angular.json'
      - 'tsconfig*.json'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'angular.json'
      - 'tsconfig*.json'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

# Least-privilege token: this workflow only checks out code and uploads a test
# artifact (artifact upload uses the Actions runtime token, not GITHUB_TOKEN).
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Build a DEVELOPMENT bundle (serviceWorker: false — ngsw would intercept
      # the ATT&CK fetch below Playwright's page.route) and serve it statically;
      # playwright.config's CI branch starts the locked http-server devDependency
      # over dist/. This avoids both prior CI failure modes: SW interception and
      # ng-serve JIT stalls.
      - run: npx ng build --configuration development
      - run: npx playwright test
      # A test that only passed on its retry is flaky, not green: surface it.
      - name: Fail on flaky tests
        if: ${{ !cancelled() }}
        run: node e2e/check-flaky.mjs test-results/results.json
      # Keep the report on every completed run (pass or fail) so a green run
      # can still be inspected. `failure()` is false when the job is cancelled
      # by timeout-minutes; only a cancelled run has nothing to upload.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
