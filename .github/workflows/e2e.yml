name: E2E Tests

# End-to-end tests run on their own, NON-BLOCKING, so a slow or flaky browser
# run on a constrained runner never blocks the Pages deploy. The deploy
# workflow gates on unit tests + build only.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
  workflow_dispatch:

# Least-privilege token: this workflow only checks out code and uploads a test
# artifact (artifact upload uses the Actions runtime token, not GITHUB_TOKEN).
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Build a DEVELOPMENT bundle (serviceWorker: false — ngsw would intercept
      # the ATT&CK fetch below Playwright's page.route) and serve it statically;
      # playwright.config's CI branch starts http-server over dist/. This avoids
      # both prior CI failure modes: SW interception and ng-serve JIT stalls.
      - run: npx ng build --configuration development
      - run: npx playwright test
      # A test that only passed on its retry is flaky, not green: surface it.
      - name: Fail on flaky tests
        if: ${{ !cancelled() }}
        run: node e2e/check-flaky.mjs playwright-report/results.json
      # `failure()` is false when the job is cancelled by timeout-minutes, which
      # is exactly the hung-server case whose traces matter most; `!cancelled()`
      # uploads on failure AND on timeout, and on success (cheap, 7-day TTL).
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
