name: E2E Tests

# End-to-end tests run on their own, NON-BLOCKING, so a slow or flaky browser
# run on a constrained runner never blocks the Pages deploy. The deploy
# workflow gates on unit tests + build only.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: rm -f package-lock.json && npm install
      - run: npx playwright install --with-deps chromium
      # Playwright's webServer starts `ng serve`; CI-aware timeouts in the
      # config and spec absorb first-hit lazy-route compilation.
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
