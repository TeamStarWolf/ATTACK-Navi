name: E2E Tests

# End-to-end tests run on their own, NON-BLOCKING, so a slow or flaky browser
# run on a constrained runner never blocks the Pages deploy. The deploy
# workflow gates on unit tests + build only.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: rm -f package-lock.json && npm install
      - run: npx playwright install --with-deps chromium
      # Build a DEVELOPMENT bundle (serviceWorker: false — ngsw would intercept
      # the ATT&CK fetch below Playwright's page.route) and serve it statically;
      # playwright.config's CI branch starts http-server over dist/. This avoids
      # both prior CI failure modes: SW interception and ng-serve JIT stalls.
      - run: npx ng build --configuration development
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
