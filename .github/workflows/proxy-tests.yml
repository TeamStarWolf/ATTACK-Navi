name: Proxy Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/proxy-tests.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/proxy-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # One Node line across the repo: Dockerfiles, deploy, e2e, ci and
          # refresh-data all run 24 (Node 20 reached end-of-life 2026-04-30).
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - run: npm test --prefix server
