name: Proxy Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/proxy-tests.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/proxy-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - run: npm test --prefix server
