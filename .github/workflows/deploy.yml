name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'   # Daily at 6:17 AM UTC (off-minute to avoid fleet stampede)
  workflow_dispatch:        # On-demand via Actions tab or gh workflow run

# Workflow-level token is read-only. Only the deploy job needs the Pages and
# OIDC scopes; the build job runs `npm ci` (lifecycle scripts of hundreds of
# packages), Karma and ng build and must not hold them.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Unit tests gate the deploy (fast + reliable). End-to-end tests run in a
      # separate, non-blocking workflow (.github/workflows/e2e.yml) so a flaky
      # browser run on a constrained runner never blocks shipping docs/UI fixes.
      - run: npx ng test --no-watch --browsers=ChromeHeadless
      - run: npx ng build --base-href /ATTACK-Navi/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/mitre-mitigation-navigator/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
