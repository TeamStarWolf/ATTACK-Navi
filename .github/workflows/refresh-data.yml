name: Refresh Bundled Data

# Keeps the shipped data honest: the bundled ATT&CK snapshots power the
# instant first paint (bundled-first loading) and the CVE2CAPEC asset backs
# CVE→ATT&CK mappings. Both are point-in-time copies that would silently age;
# this workflow regenerates them monthly and opens a PR for review.
#
# Two jobs on purpose: `refresh` downloads, gates and validates with a
# read-only token (npm ci runs lifecycle scripts of hundreds of packages and
# must not hold a write token); only `open-pr` holds contents/pull-requests
# write, and it never installs anything.
#
# The artifact that crosses between the jobs is UNTRUSTED input to `open-pr`
# (a compromised dependency in `refresh` could otherwise plant `..` paths,
# absolute paths, symlinks or hardlinks into .git/hooks or .github/workflows).
# So `refresh` packages it from an explicit allowlist with a sha256 manifest
# BEFORE `npm ci` runs, and `open-pr` re-verifies every entry with
# scripts/ci/verify-data-archive.mjs, extracts into an empty temp directory,
# copies only src/assets/data/ files into the checkout, keeps no persisted
# git credential and runs git with hooks disabled.
on:
  schedule:
    - cron: '43 5 3 * *'   # 05:43 UTC on the 3rd of each month (off-minute)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Download, gate and validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      attack_sha: ${{ steps.upstream.outputs.attack_sha }}
      f3_sha: ${{ steps.upstream.outputs.f3_sha }}
      versions: ${{ steps.gate.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # Pin each upstream to the commit it is at right now, so every file in
      # this run comes from one revision and the PR records which one.
      - name: Resolve upstream commits
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ATTACK_SHA=$(gh api repos/mitre-attack/attack-stix-data/commits/master --jq .sha)
          F3_SHA=$(gh api repos/center-for-threat-informed-defense/fight-fraud-framework/commits/main --jq .sha)
          [[ "$ATTACK_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::could not resolve attack-stix-data master"; exit 1; }
          [[ "$F3_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::could not resolve fight-fraud-framework main"; exit 1; }
          echo "attack_sha=$ATTACK_SHA" >> "$GITHUB_OUTPUT"
          echo "f3_sha=$F3_SHA" >> "$GITHUB_OUTPUT"
          echo "attack-stix-data@$ATTACK_SHA, fight-fraud-framework@$F3_SHA"

      - name: Download ATT&CK STIX snapshots and F3 at the resolved commits
        env:
          ATTACK_SHA: ${{ steps.upstream.outputs.attack_sha }}
          F3_SHA: ${{ steps.upstream.outputs.f3_sha }}
        run: |
          set -euo pipefail
          for domain in enterprise ics mobile; do
            curl -fsSL --retry 3 \
              "https://raw.githubusercontent.com/mitre-attack/attack-stix-data/${ATTACK_SHA}/${domain}-attack/${domain}-attack.json" \
              -o "src/assets/data/${domain}-attack.json"
          done
          # CTID F3 Fraud Framework (fourth domain)
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/center-for-threat-informed-defense/fight-fraud-framework/${F3_SHA}/public/f3-stix.json" \
            -o "src/assets/data/f3-attack.json"

      # Shape, object floor, no version downgrade, one ATT&CK version across
      # enterprise/ics/mobile. Writes the version table to the job summary.
      - name: Gate downloaded bundles against the committed ones
        id: gate
        run: node scripts/check-refreshed-bundles.mjs

      - name: Regenerate CVE→ATT&CK asset from CVE2CAPEC
        run: node scripts/build-cve-technique-map.mjs

      # Rule coverage (Elastic detection-rules, Splunk security_content,
      # mdecrevoisier SIGMA-detection-rules): move each pin to its branch head
      # (gh api, read-only, same token use as "Resolve upstream commits"), then
      # rebuild src/assets/data/rule-coverage-snapshot.json from the rule bodies.
      # The tarballs come anonymously from codeload.github.com. The file records
      # the new SHAs, so the review PR carries the moved pins inside the asset;
      # the script's own PINS block is rewritten here too but does not travel.
      # Expected runtime: about 1 minute (roughly 80 MB of tarballs, parsed in memory).
      - name: Rebuild the rule-coverage snapshot at the branch heads
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/build-rule-coverage-snapshot.mjs --update-pins

      # The three curated library layers record the bundled Enterprise version
      # and its SHA-256; rewrite that provenance to the new snapshot and then
      # validate every technique/tactic pair against it. A retired technique
      # fails here and has to be curated by hand before the data can ship.
      - name: Validate curated layers against the refreshed bundle
        run: node scripts/validate-curated-threat-layers.mjs --update-bundled-metadata

      - name: Detect changes
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet -- src/assets/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Bundled data already current — nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- src/assets/data | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # Package and upload BEFORE any dependency is installed: from `npm ci`
      # on, third-party lifecycle scripts run in this job and must not be
      # able to shape what the privileged open-pr job applies. The file list
      # is an explicit allowlist (tracked files changed under
      # src/assets/data/); the manifest step fails the job on any other path,
      # a symlink or a non-regular file and records each file's sha256. An
      # uploaded artifact cannot be replaced by later steps, and open-pr only
      # runs when every later step (tests, build) has passed.
      - name: Package the changed data files (allowlist + sha256 manifest)
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git diff --name-only -- src/assets/data > changed-files.txt
          wc -l changed-files.txt
          node scripts/ci/verify-data-archive.mjs manifest changed-files.txt refreshed-data.manifest.json
          tar --format=ustar --no-recursion --owner=0 --group=0 --numeric-owner \
            -czf refreshed-data.tgz --verbatim-files-from -T changed-files.txt
          node scripts/ci/verify-data-archive.mjs check-archive refreshed-data.tgz refreshed-data.manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.diff.outputs.changed == 'true'
        with:
          name: refreshed-data
          path: |
            refreshed-data.tgz
            refreshed-data.manifest.json
          retention-days: 7
          if-no-files-found: error

      # The PR this workflow opens is created with the workflow token, and
      # GitHub does not run pull_request workflows for such PRs, so the unit
      # suite and the production build run HERE, against the refreshed data,
      # and the PR body cites this run as the evidence.
      - name: Install dependencies
        if: steps.diff.outputs.changed == 'true'
        run: npm ci
      - name: Unit tests against the refreshed bundles
        if: steps.diff.outputs.changed == 'true'
        run: npx ng test --no-watch --browsers=ChromeHeadless
      - name: Production build against the refreshed bundles
        if: steps.diff.outputs.changed == 'true'
        run: npx ng build --configuration production

  open-pr:
    name: Push branch and open the review PR
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # No credential is persisted into .git/config; the push below passes
      # the token explicitly, to that one command only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Downloaded OUTSIDE the workspace: it is untrusted until verified.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: refreshed-data
          path: ${{ runner.temp }}/refreshed-data
      # The artifact comes from a job that ran npm ci, so it is untrusted:
      # check the manifest (every path under src/assets/data/, no '..', no
      # absolute path), check every tar entry (natively and via tar -tzvf:
      # regular files only, no symlinks or hardlinks, inside the prefix, no
      # '..', no leading '/', sha256 equal to the manifest), extract into an
      # empty temp directory, re-verify the extracted tree, then copy only the
      # manifest's paths into the checkout. Nothing is extracted at the root.
      - name: Verify and apply the refreshed data
        env:
          ART: ${{ runner.temp }}/refreshed-data
        run: |
          set -euo pipefail
          VERIFY=scripts/ci/verify-data-archive.mjs
          MANIFEST="$ART/refreshed-data.manifest.json"
          node "$VERIFY" check-manifest "$MANIFEST"
          tar -tzvf "$ART/refreshed-data.tgz"
          node "$VERIFY" check-archive "$ART/refreshed-data.tgz" "$MANIFEST"
          TMP="$(mktemp -d "${RUNNER_TEMP}/refreshed-data-extract.XXXXXX")"
          tar -xzf "$ART/refreshed-data.tgz" --no-same-owner --no-overwrite-dir -C "$TMP"
          node "$VERIFY" check-extracted "$TMP" "$MANIFEST"
          node "$VERIFY" install "$TMP" "$MANIFEST" "$GITHUB_WORKSPACE"
          rm -rf "$TMP" "$ART"
          git status --short -- src/assets/data
          # An if, not `diff && exit`: as the last line, a false && list would
          # make the step exit 1 exactly when there ARE changes.
          if git diff --quiet -- src/assets/data; then
            echo "::error::artifact contained no changes"; exit 1
          fi

      - name: Push branch and open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ATTACK_SHA: ${{ needs.refresh.outputs.attack_sha }}
          F3_SHA: ${{ needs.refresh.outputs.f3_sha }}
          VERSIONS: ${{ needs.refresh.outputs.versions }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          MONTH="$(date +%Y-%m)"
          BRANCH="data-refresh/${MONTH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Hooks are disabled for every git command that could run one.
          git -c core.hooksPath=/dev/null checkout -B "$BRANCH"
          git add src/assets/data
          git -c core.hooksPath=/dev/null commit -m "chore(data): monthly bundled-data refresh (${MONTH})" \
            -m "Automated refresh of the bundled ATT&CK STIX snapshots (enterprise/ics/mobile), the F3 bundle, the CVE2CAPEC-derived cve-technique-map asset and the rule-coverage snapshot; curated-layer provenance rewritten to the new snapshot." \
            -m "Sources: mitre-attack/attack-stix-data@${ATTACK_SHA}, center-for-threat-informed-defense/fight-fraud-framework@${F3_SHA}. Generated by .github/workflows/refresh-data.yml (${RUN_URL})."
          # persist-credentials is off, so authenticate this one push
          # explicitly. The header reaches git through this command's
          # environment only (not argv, not .git/config) and is masked.
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${AUTH}"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH}" \
            git -c core.hooksPath=/dev/null push -f origin "$BRANCH"

          TABLE=$(node -e '
            const v = JSON.parse(process.env.VERSIONS);
            const rows = Object.entries(v).map(([k, r]) => `| ${k} | ${r.committed} | ${r.downloaded} | ${r.objects} |`);
            console.log(["| Bundle | Committed | Downloaded | Objects |", "| --- | --- | --- | --- |", ...rows].join("\n"));
          ')
          # Keep the body lines flush with the block indent: Markdown treats
          # four or more leading spaces as a code block.
          cat > pr-body.md <<EOF
          Automated monthly refresh of bundled data assets.

          ${TABLE}

          Sources, pinned to the commit used for this run:
          - mitre-attack/attack-stix-data @ \`${ATTACK_SHA}\`
          - center-for-threat-informed-defense/fight-fraud-framework @ \`${F3_SHA}\`
          - \`cve-technique-map.json\` regenerated from the Galeax/CVE2CAPEC pipeline (scripts/build-cve-technique-map.mjs)
          - \`rule-coverage-snapshot.json\` rebuilt at the branch heads of elastic/detection-rules, splunk/security_content and mdecrevoisier/SIGMA-detection-rules (scripts/build-rule-coverage-snapshot.mjs --update-pins; the SHAs are recorded in the file)

          What ran before this PR was opened, in ${RUN_URL}:
          - bundle gate (STIX shape, object floor, no version downgrade, one ATT&CK version across domains)
          - \`validate-curated-threat-layers.mjs --update-bundled-metadata\` (curated layers revalidated against the new snapshot)
          - \`npm ci\`, \`ng test\` (full unit suite) and \`ng build --configuration production\` against the refreshed data

          This PR was opened with the workflow token, so GitHub does not run pull_request workflows on it. To get the CI check on the PR itself, run \`gh workflow run ci.yml --ref ${BRANCH}\` or close and reopen the PR. Merge to ship; the deploy workflow takes it live.
          EOF

          EXISTING=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --body-file pr-body.md
            echo "Updated existing PR #${EXISTING} for ${BRANCH}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          COMPARE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
          if ! OUTPUT=$(gh pr create --base main --head "$BRANCH" \
                --title "chore(data): monthly bundled-data refresh (${MONTH})" \
                --body-file pr-body.md 2>&1); then
            echo "$OUTPUT"
            {
              echo "## Refreshed data is pushed to \`${BRANCH}\` but the pull request could not be opened"
              echo
              echo '```'
              echo "$OUTPUT"
              echo '```'
              echo
              echo "If the error says GitHub Actions is not permitted to create or approve pull requests, a repository owner must turn on **Settings -> Actions -> General -> Workflow permissions -> \"Allow GitHub Actions to create and approve pull requests\"**, then re-run this workflow."
              echo
              echo "Until then, open the PR by hand from ${COMPARE_URL}"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::gh pr create failed; see the job summary for the repository setting that must be enabled."
            exit 1
          fi
          echo "$OUTPUT"
          echo "Opened ${OUTPUT} for ${BRANCH}" | tee -a "$GITHUB_STEP_SUMMARY"
