name: Refresh Bundled Data

# Keeps the shipped data honest: the bundled ATT&CK snapshots power the
# instant first paint (bundled-first loading) and the CVE2CAPEC asset backs
# CVE→ATT&CK mappings. Both are point-in-time copies that would silently age;
# this workflow regenerates them monthly and opens a PR for review.
on:
  schedule:
    - cron: '43 5 3 * *'   # 05:43 UTC on the 3rd of each month (off-minute)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Download latest ATT&CK STIX snapshots
        run: |
          set -euo pipefail
          for domain in enterprise ics mobile; do
            curl -fsSL --retry 3 \
              "https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/${domain}-attack/${domain}-attack.json" \
              -o "src/assets/data/${domain}-attack.json"
            # sanity: must be a STIX bundle with objects
            node -e "const b=require('./src/assets/data/${domain}-attack.json'); if(b.type!=='bundle'||!Array.isArray(b.objects)||b.objects.length<100){process.exit(1)}"
          done

      - name: Regenerate CVE→ATT&CK asset from CVE2CAPEC
        run: node scripts/build-cve-technique-map.mjs

      - name: Open PR if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- src/assets/data; then
            echo "Bundled data already current — nothing to do."
            exit 0
          fi
          BRANCH="data-refresh/$(date +%Y-%m)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add src/assets/data
          git commit -m "chore(data): monthly bundled-data refresh ($(date +%Y-%m))" \
            -m "Automated refresh of the bundled ATT&CK STIX snapshots (enterprise/ics/mobile) and the CVE2CAPEC-derived cve-technique-map asset. Generated by .github/workflows/refresh-data.yml."
          git push -f origin "$BRANCH"
          gh pr create --fill --base main --head "$BRANCH" \
            --title "chore(data): monthly bundled-data refresh ($(date +%Y-%m))" \
            --body "Automated monthly refresh of bundled data assets:

          - ATT&CK STIX snapshots (enterprise / ics / mobile) from mitre-attack/attack-stix-data
          - \`cve-technique-map.json\` regenerated from the Galeax/CVE2CAPEC pipeline

          CI (unit tests + build) validates the parse. Merge to ship; the deploy workflow takes it live." \
            || echo "PR already exists for $BRANCH"
