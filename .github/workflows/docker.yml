name: Docker Build

# The push and pull_request path lists must stay identical: a PR that only
# changes build configuration (angular.json, tsconfig*) once merged with no
# Docker build because the PR list was shorter than the push list.
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'nginx.conf'
      - 'nginx-security-headers.conf'
      - 'docker-compose.yml'
      - 'scripts/check-csp-connect-src.mjs'
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'angular.json'
      - 'tsconfig*.json'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'nginx.conf'
      - 'nginx-security-headers.conf'
      - 'docker-compose.yml'
      - 'scripts/check-csp-connect-src.mjs'
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'angular.json'
      - 'tsconfig*.json'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    name: Build and smoke-test Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Static check - shipped CSP allows every runtime origin
        run: node scripts/check-csp-connect-src.mjs nginx-security-headers.conf

      - name: Build Docker image
        run: docker build -t attack-navi:ci .

      - name: Smoke-test - container starts and serves
        run: |
          # Run with the Helm chart's hardening: read-only root filesystem with
          # writable /tmp (pid file, temp buffers) and /etc/nginx/conf.d (where the
          # entrypoint renders the nginx templates), no capabilities, no privilege
          # escalation. Every check below then runs against the hardened container.
          docker run -d --name attack-navi-test -p 8080:8080 \
            --read-only --tmpfs /tmp --tmpfs /etc/nginx/conf.d \
            --cap-drop ALL --security-opt no-new-privileges \
            attack-navi:ci
          # Wait up to 15s for nginx to become ready
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/ > /dev/null 2>&1; then
              echo "nginx is up after ${i}s"
              break
            fi
            sleep 1
          done
          # Verify HTTP 200 on root
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/)
          echo "HTTP status: $STATUS"
          [ "$STATUS" = "200" ] || (echo "Expected 200, got $STATUS" && exit 1)

      - name: Smoke-test - security headers on the page and on a static asset
        run: |
          set -e
          curl -sI http://localhost:8080/ | tr -d '\r' > page-headers.txt
          echo "--- / headers"; cat page-headers.txt
          CSP=$(grep -i '^content-security-policy:' page-headers.txt | cut -d' ' -f2-)
          [ -n "$CSP" ] || (echo "No Content-Security-Policy on /" && exit 1)
          node scripts/check-csp-connect-src.mjs --header "$CSP"
          case "$CSP" in *'${CSP_EXTRA_CONNECT_SRC}'*) echo "envsubst did not render the CSP template"; exit 1;; esac
          # The asset location declares its own add_header, which would drop every
          # server-level header unless the snippet is included there too.
          ASSET=$(curl -s http://localhost:8080/ | grep -oE '(main|polyfills|chunk)-[A-Za-z0-9]+\.js' | head -1)
          [ -n "$ASSET" ] || (echo "No hashed JS asset referenced by index.html" && exit 1)
          curl -sI "http://localhost:8080/$ASSET" | tr -d '\r' > asset-headers.txt
          echo "--- /$ASSET headers"; cat asset-headers.txt
          grep -qi '^HTTP/.* 200' asset-headers.txt
          grep -qi '^x-content-type-options: nosniff' asset-headers.txt
          grep -qi '^content-security-policy:' asset-headers.txt
          grep -qi '^x-frame-options:' asset-headers.txt
          grep -qi '^referrer-policy:' asset-headers.txt
          grep -qi '^cache-control: public, immutable' asset-headers.txt
          # The same-origin proxy route exists (upstream absent in app-only mode -> 502, not 404)
          API=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/health)
          echo "/api/health without a proxy: $API"
          [ "$API" = "502" ] || (echo "Expected 502 from the proxy route without a proxy, got $API" && exit 1)

      - name: Smoke-test - rendered config is active on a read-only root filesystem
        run: |
          set -e
          # If the entrypoint cannot write /etc/nginx/conf.d it logs "not writable",
          # exits 0 and nginx starts on the stock default.conf: / still answers 200
          # but security headers, the SPA fallback and /api/ are gone.
          docker logs attack-navi-test > container.log 2>&1
          if grep -qi 'not writable' container.log; then
            cat container.log; echo "entrypoint could not render the nginx templates"; exit 1
          fi
          grep -q 'Running envsubst on /etc/nginx/templates/default.conf.template' container.log
          # A deep link is answered by the SPA fallback (try_files ... /index.html);
          # the stock config would return 404 here.
          curl -s -D deep-headers.txt -o deep-body.html -w "%{http_code}" \
            http://localhost:8080/smoke/deep/link > deep-status.txt
          tr -d '\r' < deep-headers.txt > deep-headers.clean.txt
          echo "--- /smoke/deep/link: $(cat deep-status.txt)"; cat deep-headers.clean.txt
          [ "$(cat deep-status.txt)" = "200" ] || (echo "Expected 200 from the SPA fallback on a deep link" && exit 1)
          grep -qi '<app-root' deep-body.html || (echo "Deep link did not return index.html" && exit 1)
          grep -qi '^content-security-policy:' deep-headers.clean.txt || (echo "No Content-Security-Policy on a deep link" && exit 1)

      - name: Smoke-test - nginx runs as a non-root user
        run: |
          # The image is built on nginxinc/nginx-unprivileged so the Helm chart can
          # enforce runAsNonRoot. Fail if the container's main process is root.
          UID_IN_CONTAINER=$(docker exec attack-navi-test id -u)
          echo "container uid: $UID_IN_CONTAINER"
          [ "$UID_IN_CONTAINER" != "0" ] || (echo "nginx is running as root" && exit 1)

      - name: Dump container logs on failure
        if: failure()
        run: docker logs attack-navi-test || true

      - name: Stop test container
        if: always()
        run: docker rm -f attack-navi-test || true

      - name: Smoke-test - docker compose stack (app + proxy, no server/.env)
        run: |
          set -e
          docker compose up -d --build
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/health > /dev/null 2>&1; then
              echo "proxy reachable through nginx after ${i}s"
              break
            fi
            sleep 1
          done
          BODY=$(curl -s http://localhost:8080/api/health)
          echo "/api/health via nginx: $BODY"
          echo "$BODY" | grep -q '"service":"attack-nav-proxy"'

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs || true

      - name: Stop compose stack
        if: always()
        run: docker compose down -v --remove-orphans || true
