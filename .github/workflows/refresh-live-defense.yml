name: Refresh Live Defense

# The offline "brain" of the Live Defense lens (Live Defense slice), on a schedule,
# sibling to refresh-data.yml. It regenerates the two shipped artifacts
# (src/assets/data/live-defense/live-defense.layer.json and .evidence.json) from the
# committed CISA KEV snapshot + the CWE exploitation anchor, and opens a review PR when
# they drift — which they do whenever the bundled KEV snapshot advances (the owner's KEV
# refresh moves that pin) or the brain changes. It deliberately does NOT move the KEV pin
# itself: that pin, and its source-inventory/facts updates, stay the KEV snapshot's own
# concern (this slice is intentionally narrow).
#
# No npm ci: scripts/build-live-defense.mjs uses only Node's built-ins (the truth-vocab
# part of its accuracy gate is skipped without the TypeScript dev dep, but its schema,
# KEV-membership, live-id and no-un-sourced-heat checks still run, and it writes nothing
# unless they pass). So NO third-party lifecycle script runs here, and holding a write
# token to open the PR is safe. The full gate — truth-vocab and the byte-identical
# --check — runs on the PR through ci.yml (trigger it as the body says, since a PR opened
# with the workflow token does not start pull_request workflows).
on:
  schedule:
    - cron: '17 6 * * 1'   # 06:17 UTC every Monday (off-minute)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Regenerate the Live Defense artifacts and open a review PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # No persisted credential: the push below authenticates explicitly, to that
      # one command only (same pattern as refresh-data.yml's open-pr job).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # Regenerate from the committed assets. The script's accuracy gate runs first and
      # it writes the two files only if the gate passes; a gate failure fails the job.
      - name: Regenerate the Live Defense artifacts
        run: node scripts/build-live-defense.mjs

      - name: Detect changes
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet -- src/assets/data/live-defense; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Live Defense artifacts already current — nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- src/assets/data/live-defense | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Push branch and open or update the review PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          DATE="$(date +%Y-%m-%d)"
          BRANCH="live-defense-refresh/${DATE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null checkout -B "$BRANCH"
          git add src/assets/data/live-defense
          git -c core.hooksPath=/dev/null commit -m "chore(live-defense): refresh the KEV exploitation-pressure artifacts (${DATE})" \
            -m "Regenerated by .github/workflows/refresh-live-defense.yml from the committed CISA KEV snapshot and the CWE exploitation anchor (scripts/build-live-defense.mjs). ${RUN_URL}"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${AUTH}"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH}" \
            git -c core.hooksPath=/dev/null push -f origin "$BRANCH"

          cat > pr-body.md <<EOF
          Automated refresh of the Live Defense lens's two shipped artifacts (\`src/assets/data/live-defense/\`), regenerated from the committed CISA KEV snapshot and the CWE exploitation anchor by \`scripts/build-live-defense.mjs\`. KEV is CC0; the anchor is project-authored (MIT); no GPL mapping data is added.

          The script's accuracy gate (schema, every CVE present in the KEV snapshot, every technique id live in the bundle, no un-sourced heat) ran before these files were written. The truth-vocab lint over each brief and the byte-identical \`--check\` run on CI.

          This PR was opened with the workflow token, so GitHub does not run pull_request workflows on it. To get the CI check, run \`gh workflow run ci.yml --ref ${BRANCH}\` or close and reopen the PR. Review before merging; the deploy workflow takes it live.

          Generated in ${RUN_URL}.
          EOF

          EXISTING=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --body-file pr-body.md
            echo "Updated existing PR #${EXISTING} for ${BRANCH}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" \
            --title "chore(live-defense): refresh KEV exploitation-pressure artifacts (${DATE})" \
            --body-file pr-body.md \
            | tee -a "$GITHUB_STEP_SUMMARY"
