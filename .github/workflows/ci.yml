name: CI

# Pull-request gate. deploy.yml runs the unit suite only after a merge, so
# this is the one place a pull request gets `ng test` before it lands.
# docker.yml already builds the production bundle on PRs that touch src/,
# but its path filter skips config-only changes, so the production build
# runs here too. There is deliberately NO path filter: a required status
# check that is skipped by a filter blocks the merge instead of passing.
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  push:
    branches: [main]
  # Run against any ref by hand, e.g. `gh workflow run ci.yml --ref data-refresh/2026-11`.
  # A pull request opened with the workflow token (refresh-data.yml) does not
  # trigger pull_request workflows, so this is how that PR gets its check.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit tests, curated-layer validation, production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # Trust-boundary verifier for refresh-data.yml's artifact; its tests
      # build real malicious archives with tar (no dependencies needed).
      - run: node --test scripts/ci/verify-data-archive.test.mjs
      - run: npm ci
      # Curated library layers must still match the bundled Enterprise snapshot.
      - run: npm run validate:layers
      # Every file or folder under src/assets/data is read by app code or listed
      # as served for manual import (post-Phase-1 QA R7: no asset ships unread).
      - run: node --test scripts/check-data-assets.test.mjs
      - run: node scripts/check-data-assets.mjs
      # Truth-vocabulary lint (plan 4.1, epic E1.1): banned and rung-mismatched
      # words in templates, string literals, README and docs fail the gate.
      # Its own tests run first; one of them plants a violation and expects
      # exit 1. Needs npm ci (it reads TypeScript sources with the compiler).
      - run: node --test scripts/lint-truth-vocab.test.mjs
      - run: node scripts/lint-truth-vocab.mjs
      # The bundled KEV snapshot (plan E1.3) is sound, byte-identical to what
      # scripts/build-kev-snapshot.mjs writes, and the one the registry names.
      # No network: the builder's fetch is not exercised here.
      - run: node --test scripts/build-kev-snapshot.test.mjs
      # Headline facts (plan E0): docs/FACTS.md must still match the code, and the
      # gated docs (README, ARCHITECTURE, HANDOFF, QUICKSTART) must match it, so a
      # stale count or version fails the PR instead of landing. Its own tests run
      # first. Needs npm ci (gen-facts reads TypeScript sources with the compiler).
      - run: node --test scripts/check-facts.test.mjs
      - run: node scripts/gen-facts.mjs --check
      - run: node scripts/check-facts.mjs
      - run: npx ng test --no-watch --browsers=ChromeHeadless
      - run: npx ng build --configuration production
