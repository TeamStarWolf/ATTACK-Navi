# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# A sample workflow which sets up periodic OSV-Scanner scanning for vulnerabilities,
# in addition to a PR check which fails if new vulnerabilities are introduced.
#
# For more examples and options, including how to ignore specific vulnerabilities,
# see https://google.github.io/osv-scanner/github-action/

name: OSV-Scanner

on:
  pull_request:
    branches: [ "main" ]
  merge_group:
    branches: [ "main" ]
  schedule:
    - cron: '30 15 * * 6'
  push:
    branches: [ "main" ]

permissions:
  # Read Actions metadata required by the pinned reusable scanner
  actions: read
  # Require writing security events to upload SARIF file to security tab
  security-events: write
  # Read commit contents
  contents: read

jobs:
  # Both jobs are pinned to the SAME osv-scanner-action commit so Dependabot
  # bumps them together. osv-scanner v2 removed the `--skip-git` flag (git-root
  # scanning is now opt-in via `--include-git-root`); passing it made the
  # scanner exit 127 before writing any results, which failed every push run
  # and let the PR scan report "no new vulnerabilities" with zero packages
  # scanned. Keep scan-args to flags that exist in the pinned version.
  # Vulnerability ignores live in osv-scanner.toml next to package-lock.json.
  scan-scheduled:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc" # v2.6.0
    with:
      scan-args: |-
        -r
        ./
  scan-pr:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    # v2.6.0 adds a "Check that both scans completed" step, so a scanner
    # error on either side fails the job instead of passing as a clean diff.
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc" # v2.6.0
    with:
      scan-args: |-
        -r
        ./
