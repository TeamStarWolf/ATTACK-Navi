<!-- Top bar -->
<app-toolbar
  [mitigations]="domain?.mitigations ?? []"
  [techniques]="domain?.techniques ?? []"
  (showGapView)="gapViewRef?.show()"
  (toggleDark)="toggleDarkMode()"
  (copyShareLink)="copyShareLink()"
  [isLightMode]="isLightMode"
  [currentDomain]="currentDomain"
  (domainChange)="onDomainChange($event)"
  [viewMode]="viewMode"
  (viewModeChange)="onViewModeChange($event)"
/>

<!-- Library view (top-level workspace swap; becomes a route in P1d) -->
@if (viewMode === 'library') {
  <app-library-workbench />
}

<!-- App shell: nav rail + routed workspace -->
<div class="app-shell" [hidden]="viewMode === 'library'">

  <!-- Left nav rail -->
  <app-nav-rail
    [activePanel]="activePanel$ | async"
    (panelToggle)="onNavPanelToggle($event)"
    (focusSearch)="focusTechniqueSearch()">
  </app-nav-rail>

  <!-- Workspace -->
  <div class="workspace-area">
    <router-outlet />
  </div>
</div>

<!-- Sidebar (technique details) — fixed overlay -->
<app-sidebar />

<!-- Gap view — overlay -->
<app-gap-view #gapViewRef />

<!-- Panel overlays — converted to routed pages batch-by-batch (P1b-P1d) -->
<app-threat-panel />
<app-report-panel />
<app-controls-panel />
<app-software-panel [software]="domain?.software ?? []" />
<app-comparison-panel />
<app-layers-panel />
<app-roadmap-panel />
<app-actor-profile-panel />
<app-compliance-panel />
<app-actor-compare-panel />
<app-timeline-panel />
<app-settings-panel />
<app-custom-mit-panel />
<app-scenario-panel />
<app-target-panel />
<app-keyboard-help />
<app-watchlist-panel />
<app-changelog-panel />
<app-tags-panel />
<app-campaign-timeline-panel />
<app-coverage-diff-panel />
<app-threat-intelligence-panel />
<app-collection-panel />
<app-assessment-wizard />
<app-asset-panel />
<app-ir-playbook-panel />
<app-emulation-plan-panel />

@if (showToast) {
  <div class="toast-notification">{{ toastMessage }}</div>
}

<!-- Onboarding welcome overlay (first visit only) -->
<app-onboarding />
