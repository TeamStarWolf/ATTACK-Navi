<!-- Top bar -->
<app-toolbar
  [techniques]="domain?.techniques ?? []"
  (copyShareLink)="copyShareLink()"
  [currentDomain]="currentDomain"
  (domainChange)="onDomainChange($event)"
/>

<!-- Briefing strip (E1.4): one status line on every route, announced to screen readers -->
<app-briefing-strip />

<!-- App shell: nav rail + routed workspace -->
<div class="app-shell">

  <!-- Left nav rail -->
  <app-nav-rail (helpClick)="helpOverlay.toggle()" />

  <!-- Workspace: narrows by the open drawer's width, so resizing the drawer resizes the matrix -->
  <div class="workspace-area" [class.drawer-open]="drawer.open()" [style.--drawer-width]="drawer.width() + 'px'">
    <router-outlet />
  </div>
</div>

<!-- Sidebar (technique details): fixed on the right; the workspace makes room for it above 768 px -->
<app-sidebar />

<!-- Gap view — overlay -->
<app-gap-view #gapViewRef />

<!-- Global overlays -->
<app-keyboard-help />
<app-universal-search />

@if (showToast) {
  <div class="toast-notification">{{ toastMessage }}</div>
}

<!-- Onboarding welcome overlay (first visit only) -->
<app-onboarding />
