<nav class="nav-rail-inner" role="navigation" aria-label="Main navigation">
  <div class="rail-section-label" aria-hidden="true">Workspaces</div>
  <div class="nav-list">
    @for (ws of workspaces; track ws.route; let i = $index) {
      <a
        class="nav-item"
        [class.drag-over]="overIndex === i && dragIndex !== i"
        [class.dragging]="dragIndex === i"
        [routerLink]="ws.route"
        routerLinkActive="active"
        queryParamsHandling="preserve"
        [title]="ws.label + ' — drag to reorder'"
        [attr.aria-label]="ws.label"
        draggable="true"
        (dragstart)="onDragStart(i, $event)"
        (dragover)="onDragOver(i, $event)"
        (drop)="onDrop(i, $event)"
        (dragend)="onDragEnd()"
      >
        <span class="nav-grip" aria-hidden="true" title="Drag to reorder">
          <app-icon name="grip-vertical" [size]="14" />
        </span>
        <app-icon class="nav-icon" [name]="ws.icon" [size]="20" aria-hidden="true" />
        <span class="nav-label">{{ ws.label }}</span>
        @if (ws.route === '/exposure' && newKevCount > 0) {
          <span class="nav-badge" [attr.aria-label]="newKevCount + ' new KEV entries'">+{{ newKevCount }}</span>
        }
      </a>
    }
  </div>

  @if (isCustomOrder) {
    <button class="rail-reset" type="button" (click)="resetOrder()" title="Restore the default workspace order">
      <app-icon name="refresh-cw" [size]="13" aria-hidden="true" />
      <span>Reset order</span>
    </button>
  }

  <div class="nav-items-bottom">
    <button
      class="nav-item help-btn"
      title="Keyboard shortcuts and help"
      aria-label="Keyboard shortcuts and help"
      (click)="helpClick.emit()"
    >
      <app-icon class="nav-icon" name="circle-help" [size]="20" aria-hidden="true" />
      <span class="nav-label">Help</span>
    </button>
    <a
      class="nav-item"
      routerLink="/settings"
      routerLinkActive="active"
      queryParamsHandling="preserve"
      title="Settings"
      aria-label="Settings"
      (click)="onSettingsClick()"
    >
      <app-icon class="nav-icon" name="settings" [size]="20" aria-hidden="true" />
      <span class="nav-label">Settings</span>
      @if (newVersionAvailable) {
        <span class="nav-badge version-badge" aria-label="New ATT&CK version available"></span>
      }
    </a>
  </div>
</nav>
