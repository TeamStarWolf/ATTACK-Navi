<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ATT&amp;CK Navi</title>
  <meta name="author" content="TeamStarWolf">
  <meta name="description" content="A browser app for the MITRE ATT&amp;CK matrix: color it by mitigation, threat, vulnerability, detection and framework data, and explore techniques, threat groups, CVE exposure and detection coverage.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#101012">
  <noscript><style>app-root>[role="status"]{display:none}</style></noscript>
</head>
<body>
  <a class="skip-link" href="#matrix-content">Skip to matrix content</a>
  <app-root>
    <div role="status" aria-live="polite" style="min-height:60vh;display:flex;align-items:center;justify-content:center;font-family:Roboto,system-ui,sans-serif;color:#8a8a8a;">
      Loading ATT&amp;CK Navi&hellip;
    </div>
  </app-root>
  <noscript>
    <div style="max-width:40rem;margin:4rem auto;padding:1.5rem;font-family:Roboto,system-ui,sans-serif;line-height:1.5;color:#1a1a1a;background:#fafafa;border:1px solid #d4d4d8;border-radius:8px;">
      <h1 style="font-size:1.25rem;margin-top:0;">ATT&amp;CK Navi needs JavaScript</h1>
      <p>This is a single-page application that runs entirely in your browser; it needs JavaScript enabled. The source and build instructions are at <a href="https://github.com/TeamStarWolf/ATTACK-Navi" style="color:#0b57d0;">github.com/TeamStarWolf/ATTACK-Navi</a>.</p>
    </div>
  </noscript>
</body>
</html>
