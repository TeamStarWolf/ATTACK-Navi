# OSV-Scanner configuration for the root package-lock.json.
# A config file applies only to lockfiles in its own directory
# (https://google.github.io/osv-scanner/configuration/); server/package-lock.json
# has no ignores and needs no file.
#
# Both OSV jobs in .github/workflows/osv-scanner.yml run with fail-on-vuln, so
# every entry here must name a specific advisory, say why it is accepted, and
# carry an expiry so it is re-reviewed instead of rotting.
#
# Known blind spot: xlsx-js-style is a fork of SheetJS (xlsx). Advisories filed
# against the upstream `xlsx` package (for example GHSA-4r6h-8v6p-xvw6 and
# GHSA-5pgg-2g8v-p4x9) are not matched to the fork's package name by OSV, so a
# clean scan does not cover that code path; review the fork manually when
# upstream SheetJS publishes an advisory.

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"  # CVE-2026-93687: braces <=3.0.3 stack-exhaustion DoS on deeply nested patterns
ignoreUntil = 2027-01-06
reason = "No fixed release exists (3.0.3 is latest on npm, last_affected 3.0.3). braces is a dev-only transitive of karma, chokidar and stylelint/micromatch; the only input it sees is glob patterns from this repository's own config, never untrusted data. Re-check for a patched release at the ignoreUntil date."
