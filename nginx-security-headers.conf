# Security headers for every response served by the app image. nginx.conf includes
# this snippet in the server block AND in every location that declares its own
# add_header (asset caching, the /api/ proxy route), because nginx only inherits
# add_header into blocks that add nothing themselves.
#
# connect-src lists every origin the SPA fetches at runtime; scripts/check-csp-connect-src.mjs
# verifies the list against src/app/services and the Docker smoke test verifies the
# served header. ${CSP_EXTRA_CONNECT_SRC} is filled at container start (default empty)
# for direct-mode OpenCTI/MISP/TAXII origins or a proxy running on another origin.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://raw.githubusercontent.com https://api.first.org https://services.nvd.nist.gov https://api.github.com https://gitlab.com https://www.cisa.gov https://d3fend.mitre.org https://cveawg.mitre.org ${CSP_EXTRA_CONNECT_SRC};" always;
